<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900&amp;family=Space+Grotesk%3Awght%40400%3B500%3B700" onload="this.rel='stylesheet'" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<title>Stitch Design</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>
<body class="bg-gray-900">
<div class="relative flex size-full min-h-screen flex-col bg-[#111318] dark group/design-root" style='font-family: "Space Grotesk", "Noto Sans", sans-serif;'>
<div class="flex-grow flex items-center justify-center">
<div class="bg-[#181A20] rounded-xl shadow-2xl w-full max-w-md p-8 m-4">
<div class="flex justify-between items-center mb-6">
<h2 class="text-white text-2xl font-bold">Share Idea</h2>
<button class="text-gray-400 hover:text-white">
<span class="material-symbols-outlined"> close </span>
</button>
</div>
<div class="space-y-6">
<div>
<label class="block text-sm font-medium text-gray-300 mb-2" for="email">Share via Email</label>
<div class="flex gap-3">
<input class="form-input flex-grow w-full min-w-0 resize-none overflow-hidden rounded-md text-white focus:outline-0 focus:ring-2 focus:ring-[#135bec] border border-[#3b4354] bg-[#1c1f27] h-12 placeholder:text-gray-500 p-3 text-sm" id="email" placeholder="Enter email address" type="email"/>
<button class="flex items-center justify-center rounded-md h-12 px-4 bg-[#135bec] text-white text-sm font-bold hover:bg-blue-600 transition-colors">
<span class="material-symbols-outlined mr-2"> email </span>
                  Send
                </button>
</div>
</div>
<div class="relative flex items-center">
<div class="flex-grow border-t border-gray-700"></div>
<span class="flex-shrink mx-4 text-gray-500 text-sm">OR</span>
<div class="flex-grow border-t border-gray-700"></div>
</div>
<div>
<button class="w-full flex items-center justify-center gap-2 rounded-md h-12 px-4 bg-[#282e39] text-white text-sm font-bold hover:bg-gray-700 transition-colors">
<span class="material-symbols-outlined"> link </span>
                Generate Shareable Link
              </button>
</div>
<div>
<label class="block text-sm font-medium text-gray-300 mb-2" for="collaborator">Invite Collaborators</label>
<div class="flex gap-3">
<input class="form-input flex-grow w-full min-w-0 resize-none overflow-hidden rounded-md text-white focus:outline-0 focus:ring-2 focus:ring-[#135bec] border border-[#3b4354] bg-[#1c1f27] h-12 placeholder:text-gray-500 p-3 text-sm" id="collaborator" placeholder="Enter collaborator's email" type="email"/>
<button class="flex items-center justify-center rounded-md h-12 px-4 bg-[#282e39] text-white text-sm font-bold hover:bg-gray-700 transition-colors">
<span class="material-symbols-outlined mr-2"> person_add </span>
                  Invite
                </button>
</div>
</div>
</div>
</div>
</div>
</div>

</body></html>
